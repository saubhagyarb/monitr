<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Rounded square background in Omarchy accent yellow -->
  <rect width="64" height="64" rx="14" fill="#FFD60A"/>
  <!-- Left monitor body -->
  <rect x="6" y="14" width="22" height="26" rx="2" fill="white"/>
  <!-- Left monitor stand -->
  <rect x="14" y="40" width="6" height="6" rx="1" fill="white"/>
  <rect x="11" y="45" width="12" height="2" rx="1" fill="white"/>
  <!-- Right monitor body -->
  <rect x="32" y="18" width="26" height="20" rx="2" fill="white" opacity="0.85"/>
  <!-- Right monitor stand -->
  <rect x="41" y="38" width="6" height="5" rx="1" fill="white" opacity="0.85"/>
  <rect x="38" y="42" width="12" height="2" rx="1" fill="white" opacity="0.85"/>
</svg>
